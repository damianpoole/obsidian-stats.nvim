name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim and fd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y neovim fd-find
      - name: Install Neovim and fd (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim fd
      - name: Run headless tests
        env:
          TZ: Europe/London
          NVIM_LOG_FILE: ${{ runner.temp }}/obsidian-stats-nvim.log
        run: nvim --headless -u NONE -i NONE -n -c "lua dofile('tests/run.lua')"
